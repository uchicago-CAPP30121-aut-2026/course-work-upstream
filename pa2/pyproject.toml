[project]
name = "pa2"
version = "0.1.0"
description = "CAPP 30121 A'26 PA 2: Schelling’s Model of Housing Segregation"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "ipython>=8.27.0",
  "ruff>=0.6.4",
  "click>=7.0",
  "pytest>=3.9.1",
  "pytest_metadata>=1.7.0",
  "pytest_json>=0.4.0",
  "pytest-timeout>=2.4.0",
  "pylint>=2.13.6"
]

[tool.ruff.lint]
select = [
  "E", # pycodestyle errors - handles basic Python style
  "W", # pycodestyle warnings - handles whitespace issues
  "F", # pyflakes - handles unused imports and variables
  "N", # pep8-naming - handles naming conventions
]
ignore = [
  "F401", # allow unused imports (useful for assignments)
  "N818",
  "N806", # allow N as a variable name
  "N803", # allow N and R as parameter names
]